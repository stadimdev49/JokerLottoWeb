<!DOCTYPE html>
<html lang="el" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker & Lotto Analytics Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🎰 Lottery Analytics Pro</a>
        <div class="d-flex align-items-center gap-3">
            <div class="navbar-nav flex-row gap-2">
                <a class="nav-link active fw-bold" href="#" data-game="joker">Τζόκερ</a>
                <a class="nav-link fw-bold" href="#" data-game="lotto">Λόττο</a>
            </div>
            <button class="btn btn-outline-secondary btn-sm" id="btn-theme-toggle">🌙 Dark Mode</button>
        </div>
    </div>
</nav>

<div class="container mb-5">

    <ul class="nav nav-pills mb-4" id="mainTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="tab-analysis" data-bs-toggle="pill" data-bs-target="#panel-analysis">📊 Ανάλυση 10 Κληρώσεων</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-generator" data-bs-toggle="pill" data-bs-target="#panel-generator">🎲 Γεννήτρια Αριθμών</button>
        </li>
    </ul>

    <div class="tab-content">
        
        <!-- PANEL 1: ΑΝΑΛΥΣΗ ΤΕΛΕΥΤΑΙΩΝ 10 ΚΛΗΡΩΣΕΩΝ -->
        <div class="tab-pane fade show active" id="panel-analysis">
            <div class="card shadow-sm p-4 mb-4">
                <h5 class="card-title mb-3">Τελευταίες 10 Κληρώσεις & Συχνότητα στις Προηγούμενες</h5>
                <div class="mb-3 d-flex gap-2 flex-wrap">
                    <span class="badge cat-absent p-2">Απουσία (0)</span>
                    <span class="badge cat-1 p-2">1 Εμφάνιση</span>
                    <span class="badge cat-2 p-2">2 Εμφανίσεις</span>
                    <span class="badge cat-3plus p-2">3+ Εμφανίσεις</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Κλήρωση</th>
                                <th>Ημερομηνία</th>
                                <th>Αριθμοί & Κατηγορία Εμφάνισης</th>
                                <th>Joker</th>
                            </tr>
                        </thead>
                        <tbody id="analysis-tbody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PANEL 2: ΓΕΝΝΗΤΡΙΑ ΜΕ ΚΑΝΟΝΕΣ -->
        <div class="tab-pane fade" id="panel-generator">
            <div class="card shadow-sm p-4">
                <h5 class="card-title mb-4">Έξυπνη Γεννήτρια Δεδομένων</h5>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Τύπος Παραγωγής:</label>
                        <select id="gen-mode" class="form-select">
                            <option value="random">🎲 Πλήρως Τυχαία</option>
                            <option value="rules">🧠 Βάσει Κανόνων / Στατιστικών</option>
                        </select>
                    </div>

                    <div class="col-md-4 rules-option d-none">
                        <label class="form-label fw-bold">Εύρος Ιστορικού (Κληρώσεις):</label>
                        <input type="number" id="gen-lookback" class="form-control" value="10" min="5" max="100">
                    </div>

                    <div class="col-md-4 rules-option d-none">
                        <label class="form-label fw-bold">Στρατηγική:</label>
                        <select id="gen-rule-type" class="form-select">
                            <option value="hot">🔥 Θερμοί (Με τις περισσότερες εμφανίσεις)</option>
                            <option value="cold">❄️ Ψυχροί (Μεγάλες απουσίες)</option>
                            <option value="balanced">⚖️ Ισορροπημένο (3 Θερμοί + 2 Ψυχροί)</option>
                        </select>
                    </div>
                </div>

                <button id="btn-generate" class="btn btn-primary btn-lg w-100 mb-4">Παραγωγή Δελτίου</button>

                <div id="gen-result" class="p-4 bg-body-tertiary rounded text-center border">
                    <em class="text-muted">Επιλέξτε παραμέτρους και πατήστε "Παραγωγή Δελτίου"</em>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
